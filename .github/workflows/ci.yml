name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.8.15"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"
      - run: uv sync --frozen --group dev --no-install-project
      - run: uv build --wheel --build-constraints build-constraints.txt --require-hashes --no-cache
      - run: uv pip install --python .venv/bin/python --no-deps --no-cache dist/*.whl
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest --cov=spanvouch --cov-report=term-missing
      - name: Verify Phase 4 contracts, architecture, and delivery configuration
        run: uv run --no-sync pytest tests/contracts tests/architecture tests/test_delivery_config.py -v
      - run: uv run --no-sync spanvouch dataset generate --output .cache/ci-dataset --seed 20260715
      - name: Verify frozen dataset hashes
        shell: python
        run: |
          import json
          from pathlib import Path
          expected = json.loads(Path("evals/datasets/supportlab-v1/manifest.json").read_text())
          actual = json.loads(Path(".cache/ci-dataset/manifest.json").read_text())
          assert expected == actual, (expected, actual)
      - run: uv run --no-sync spanvouch evaluate diagnosis --output .cache/ci-rules-a.json
      - run: uv run --no-sync spanvouch evaluate diagnosis --output .cache/ci-rules-b.json
      - name: Verify byte-exact deterministic diagnosis reports
        run: cmp --silent .cache/ci-rules-a.json .cache/ci-rules-b.json
      - run: uv run --no-sync spanvouch dataset generate-review --output .cache/ci-review-dataset --seed 20260717
      - name: Verify frozen review dataset hashes
        shell: python
        run: |
          import json
          from pathlib import Path
          expected = json.loads(Path("evals/datasets/supportlab-review-v1/manifest.json").read_text())
          actual = json.loads(Path(".cache/ci-review-dataset/manifest.json").read_text())
          assert expected == actual, (expected, actual)
          for field in ("candidates_sha256", "labels_sha256", "source_manifest_sha256"):
              assert actual[field] == expected[field], field
      - run: uv run --no-sync spanvouch evaluate review --output .cache/ci-review-a.json
      - run: uv run --no-sync spanvouch evaluate review --output .cache/ci-review-b.json
      - name: Verify byte-exact deterministic review reports
        run: cmp --silent .cache/ci-review-a.json .cache/ci-review-b.json
      - run: docker compose config --quiet
      - name: Build API image
        run: docker compose build api
      - name: Smoke-test containerized API
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose ps --all || true
              docker compose logs --no-color api || true
              docker compose down --remove-orphans || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          docker compose up --detach --wait --wait-timeout 90 api
          response="$(curl --fail --show-error --silent http://127.0.0.1:8000/health)"
          python -c 'import json, sys; assert json.loads(sys.argv[1]) == {"status": "ok", "service": "spanvouch"}' "$response"

          docker compose exec -T api sh -c 'test "$(id -u):$(id -g)" = "10001:10001"'
          docker compose exec -T api sh -c 'test -w /data && test "$(stat -c %u:%g /data)" = "10001:10001"'

          trace_payload="$(head -n 1 evals/datasets/supportlab-v1/traces.jsonl)"
          trace_id="$(curl --fail --show-error --silent \
            -H 'content-type: application/json' \
            --data "$trace_payload" \
            http://127.0.0.1:8000/v1/traces \
            | python -c 'import json,sys; print(json.load(sys.stdin)["trace_id"])')"
          created="$(uv run --no-sync spanvouch review create \
            --trace-id "$trace_id" \
            --idempotency-key ci-persistence-create)"
          case_id="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["case"]["case_id"])' "$created")"
          version="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["case"]["version"])' "$created")"

          uv run --no-sync spanvouch review show --case-id "$case_id" > .cache/ci-review-before-decision.json
          uv run --no-sync spanvouch review decide \
            --case-id "$case_id" \
            --action confirm \
            --expected-version "$version" \
            --reviewer-label ci-persistence-reviewer \
            --idempotency-key ci-persistence-decision \
            > .cache/ci-review-before-restart.json

          docker compose restart api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done

          uv run --no-sync spanvouch review show --case-id "$case_id" > .cache/ci-review-after-restart.json
          cmp --silent .cache/ci-review-before-restart.json .cache/ci-review-after-restart.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path(".cache/ci-review-after-restart.json").read_text())
          assert payload["case"]["status"] == "confirmed"
          assert payload["case"]["terminal_decision_id"] == payload["decision"]["decision_id"]
          assert payload["decision"]["action"] == "confirm"
          assert len(payload["revisions"]) == 1
          assert [report["verifier_kind"] for report in payload["verifier_reports"]] == ["deterministic"]
          assert payload["events"][-2]["event_type"] == "awaiting_human_review"
          assert payload["events"][-1]["event_type"] == "human_confirmed"
          assert [event["event_sequence"] for event in payload["events"]] == list(range(len(payload["events"])))
          PY
          trap - EXIT
          docker compose down --volumes --remove-orphans
